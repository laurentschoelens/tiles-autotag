name: TILES MASTER POM

on:
  pull_request:
  push:
    branches: [ master ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test on JDK ${{ matrix.java_version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java_version: [ 17, 25 ]

    steps:
      - name: Checkout for build
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java_version }}
          cache: maven
      - name: Verify
        run: |
          mvn -B -V -U -C clean verify -Dgpg.skip=true -Doss.disallow.snapshots=false
